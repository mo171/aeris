# The infrastructure a developer needs running before `aeris doctor` can go green.
#
# what  : One service per Phase 0 dependency: PostGIS (0.2), Redis (0.3), MinIO (0.4), the Inngest dev
#         server (0.5). Phase 1.2 adds TiTiler. Each arrived with the sub-phase that first needed it,
#         following the Phase 0 setup pattern rather than being stubbed in up front.
# where : `docker compose up -d` from `backend/`. Every integration test - the ones that demonstrate a Phase 0
#         gate - runs against these containers. `aeris doctor` reports on exactly this set.
# how   : Local development runs Postgres in a container; deployed environments point DATABASE_URL at
#         Supabase instead. Both are Postgres with the PostGIS extension, so nothing in `app/` changes
#         between them - which is the reason for using the real engine locally rather than SQLite.
#
#         Ports are bound to 127.0.0.1 rather than 0.0.0.0. A database reachable from the local network is
#         a habit worth not forming.

name: aeris

services:
  postgis:
    # PostGIS 3.5 on Postgres 17. Pinned to a minor tag rather than `latest`: a spatial database that
    # silently changes version between machines is a class of "works here, not there" that costs a day.
    image: postgis/postgis:17-3.5
    container_name: aeris-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeris
      POSTGRES_PASSWORD: aeris_local_development
      POSTGRES_DB: aeris
      # Deterministic collation. Left to the host locale, index ordering differs between developer machines
      # and a `ORDER BY name` test passes in one place and fails in another.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Host port 5433, not 5432: a developer machine commonly already has a Postgres on the default
      # port, and the collision surfaces as "password authentication failed" against a database that
      # is not ours - which is a confusing failure to debug. The container still listens on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # Runs once on a fresh volume, after the image's own PostGIS setup. Drops the extensions we do
      # not use - see the script for why it matters to `alembic check`.
      - ./docker/postgis-init:/docker-entrypoint-initdb.d/aeris:ro
    healthcheck:
      # `pg_isready` answers "is the socket accepting connections", which is what dependent services need.
      # Whether the PostGIS *extension* is installed is a different question, and it is `aeris doctor`'s -
      # see app/lib/database.py, which reports the PostGIS version rather than assuming it.
      test: ["CMD-SHELL", "pg_isready -U aeris -d aeris"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # Pinned to a minor tag for the same reason as PostGIS above. Redis 8 is AGPLv3; 7.4 was the
    # source-available RSAL/SSPL interval, so 8.x is also the licence-clean choice for a project that will be
    # judged and published.
    image: redis:8.2-alpine
    container_name: aeris-redis
    restart: unless-stopped
    # Every flag here is load-bearing, so the configuration is on the command line rather than in a file that
    # would have to be mounted and kept in sync.
    #
    #   --maxmemory-policy noeviction  Locks must never be evicted. Under `allkeys-*` Redis may drop any key
    #                                  when memory fills, and under `volatile-*` it may drop any key with a
    #                                  TTL - which every lock has, because the TTL is how a crashed holder
    #                                  releases. Either would let Redis delete a *held* lock and leave two
    #                                  processes believing they own the GPU. `noeviction` fails the write
    #                                  instead, which the cache absorbs and the lock reports.
    #                                  See app/constants/redis_keys.py.
    #   --save "" / --appendonly no    No persistence, on purpose. Nothing in this instance may be worth
    #                                  surviving a restart: a cache entry is reconstructible and a lock that
    #                                  outlived the process holding it would be a bug. Anything that must
    #                                  survive belongs in Postgres.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      # The default port, unlike PostGIS's 5433. Checked rather than assumed: nothing was listening on 6379
      # on this machine, and the collision that forced Postgres onto a non-default port does not exist here.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # No volume. See the persistence note above - a named volume here would preserve exactly the state that
    # is supposed to disappear.

  minio:
    # Pinned to a release tag, not `latest`. AGPLv3.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aeris-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: aeris_local_development
      MINIO_ROOT_PASSWORD: aeris_local_development_secret
      # The load-bearing line. MinIO does **not** implement the S3 `PutBucketCors` API - it answers
      # `NotImplemented`, measured against this exact release - so CORS cannot be set per bucket from
      # application code the way it can on real S3. It is a server-wide setting instead, and this is it.
      #
      # It is set explicitly even though MinIO's default is `*`, because that default also sends
      # `Access-Control-Allow-Credentials: true` while reflecting whatever `Origin` it was given: any page
      # on the internet could read these objects from a browser. Restricting it locally means the setting is
      # exercised in development rather than discovered in production.
      #
      # `${...}` reads backend/.env, the same file app/config.py reads as STORAGE_BROWSER_ORIGIN, so the
      # allowed origin is stated once and `app/lib/storage.py` can prove the two agree.
      MINIO_API_CORS_ALLOW_ORIGIN: ${STORAGE_BROWSER_ORIGIN:-http://localhost:3000}
    command: server /data --console-address ":9001"
    ports:
      # 9000 is the S3 API - what app/lib/storage.py and every presigned URL address.
      - "127.0.0.1:9000:9000"
      # 9001 is the web console. Bound because "you will make me verify everything": an upload that the
      # tests say succeeded can be looked at. Without --console-address MinIO picks a random port each start.
      - "127.0.0.1:9001:9001"
    volumes:
      # Unlike Redis, this one persists. A COG costs minutes of GDAL to rebuild and a raw scene costs a
      # download; losing them to a `docker compose down` would make every restart an acquisition run.
      - minio_data:/data
    healthcheck:
      # MinIO's own liveness endpoint, which reports whether the object layer is initialised - not merely
      # whether the port is open. `curl` is present in this image; `wget` is not.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  inngest:
    # The dev server, not a worker. AERIS registers **no functions** with it until Phase 2.5 (ADR-002):
    # Phase 1 runs the whole engine as a CLI, where durability is the LangGraph checkpointer and a killed
    # run resumes from its last checkpoint with no queue involved. This service exists so that the SDK, the
    # server and the event round trip are proven now instead of at the moment they block the binding.
    image: inngest/inngest:v1.44.0
    container_name: aeris-inngest
    restart: unless-stopped
    # --host 0.0.0.0    the default binds inside the container only, which makes the published port useless.
    # --no-discovery    stop it scanning localhost for apps to sync. There are none, and leaving it on fills
    #                   the dashboard with sync failures against an app that does not exist. app/lib/inngest.py
    #                   reads this flag back through /dev and reports it, so the two cannot drift.
    # --no-poll         the same, for re-polling apps it has already found.
    command: inngest dev --host 0.0.0.0 --no-discovery --no-poll
    ports:
      # 8288 is both the event API and the dashboard. Open http://localhost:8288 to watch events arrive -
      # the Phase 0.5 gate is visible there as well as in the test.
      - "127.0.0.1:8288:8288"
    healthcheck:
      # The image's own binary, because there is nothing else in it: no curl, no wget, no nc, no busybox,
      # and /bin/sh is dash, so not even bash's /dev/tcp trick. `inngest api health` calls the local dev
      # server's /api/v2/health by default. Verified to exit 0 when the server answers and 1 when it does
      # not - a healthcheck that cannot fail is not one, and this command prints its error either way.
      test: ["CMD", "inngest", "api", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # No volume, and `--persist` deliberately absent. Nothing here is durable state: the events this phase
    # sends are health probes with no consumer, and when Phase 2.5 binds real functions their durable record
    # is Inngest Cloud's, not a local disk's.

volumes:
  postgis_data:
  minio_data:

# Alembic's entry point. Deliberately thin - everything that could be a decision lives in migrations/env.py.
#
# what  : Tells Alembic where the migration scripts are and how to name new ones. The database URL is NOT
#         here; env.py reads it from app.config so there is one source of truth (code-standards.md §4).
# where : Read by every `uv run alembic ...` invocation from `backend/`.
# how   : `file_template` puts a UTC timestamp in front of the revision id, so `ls migrations/versions`
#         shows migrations in the order they were written. The default naming is the bare revision hash,
#         which sorts randomly and makes a history unreadable at exactly the moment you need to read it.

[alembic]
script_location = migrations
prepend_sys_path = .

# Alembic 1.19 warns that it is falling back to splitting `prepend_sys_path` on spaces, commas and colons.
# `os` means "use this platform's path separator", which on Windows is `;` - the legacy splitter would treat
# a Windows drive letter's colon as a separator.
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
